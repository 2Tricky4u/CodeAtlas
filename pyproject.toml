[project]
name = "codeatlas"
version = "0.1.0"
description = "Evidence-driven code review and project-visualization platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.19.0",
    "claude-agent-sdk>=0.2.130",
    "fastapi>=0.141.1",
    "jsonschema>=4.26.0",
    "keyring>=25.7.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "protobuf>=7.35.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "poethepoet>=0.30",
    "grpcio-tools>=1.83.0",
    "httpx>=0.28.1",
    "types-pyyaml>=6.0.12.20260724",
    "types-jsonschema>=4.26.0.20260518",
]

[project.scripts]
codeatlas = "codeatlas.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
timeout = 120
markers = [
    "subproc: needs local git/cargo/rust-analyzer subprocesses",
    "pg: needs local PostgreSQL test database",
    "agent_live: needs logged-in claude CLI (consumes subscription quota)",
    "network: needs network access / GitHub scratch repository",
    "e2e_ui: needs Playwright browser",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["src/codeatlas/extractors/rust/scip_pb2/scip_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "S"]
ignore = ["S101"]  # assert is fine in this codebase (also used by pytest)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]  # tests may run local subprocesses with fixed args
"src/codeatlas/db/migrations/versions/*" = ["E501"]  # autogenerated DDL lines

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["codeatlas"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["codeatlas.extractors.rust.scip_pb2", "codeatlas.extractors.rust.scip_pb2.*"]
ignore_errors = true
disallow_untyped_defs = false
follow_imports = "skip"

[tool.poe.tasks]
lint = "ruff check src tests scripts"
fmt = "ruff format src tests scripts"
typecheck = "mypy"
test = "pytest"
verify-env = "python scripts/verify_env.py"
check = ["lint", "typecheck", "test"]
